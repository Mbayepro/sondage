<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Dashboard — Nelal Express</title>

<!-- Fonts & Libraries -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

<style>
  :root {
    --brand: #F97316;
    --brand-hover: #EA580C;
    --bg: #0F172A;
    --card-bg: rgba(30, 41, 59, 0.7);
    --border: rgba(255, 255, 255, 0.1);
    --text-main: #FFFFFF;
    --text-muted: #94A3B8;
    --text-dim: #64748B;
    --success: #22C55E;
    --danger: #EF4444;
    --surface: #1E293B;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Outfit', sans-serif;
    background: #0B0F1A;
    color: var(--text-main);
    min-height: 100vh;
    padding: 2rem;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 3rem;
  }

  .logo { display: flex; align-items: center; gap: .8rem; }
  .logo-icon {
    width: 42px;
    height: 42px;
    background: var(--brand);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 1.2rem;
    box-shadow: 0 0 20px rgba(249, 115, 22, 0.3);
  }
  .logo-text { font-size: 1.2rem; font-weight: 900; letter-spacing: 1px; }
  .logo-text span { color: var(--brand); }

  .status-badge {
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: .5rem 1rem;
    background: rgba(34, 197, 94, 0.1);
    border: 1px solid rgba(34, 197, 94, 0.2);
    color: var(--success);
    border-radius: 100px;
    font-size: .8rem;
    font-weight: 600;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
  .dot.offline { background: var(--danger); }
  .status-badge.offline { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); color: var(--danger); }

  /* Stats Grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1.5rem;
    margin-bottom: 3rem;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1.5rem;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    gap: .5rem;
    transition: transform 0.3s ease;
  }
  .stat-card:hover { transform: translateY(-5px); border-color: var(--brand); }
  
  .stat-label { font-size: .85rem; color: var(--text-muted); font-weight: 500; }
  .stat-value { font-size: 2rem; font-weight: 800; color: #fff; }
  .stat-value span { font-size: 1rem; color: var(--text-dim); margin-left: .3rem; }
  .stat-icon { 
    width: 40px; 
    height: 40px; 
    background: rgba(255, 255, 255, 0.05); 
    border-radius: 12px; 
    display: flex; 
    align-items: center; 
    justify-content: center;
    color: var(--brand);
    margin-bottom: .5rem;
  }

  /* Table Section */
  .table-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
  }

  .table-header {
    padding: 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .table-title { font-size: 1.2rem; font-weight: 700; }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }

  th {
    background: rgba(255, 255, 255, 0.02);
    padding: 1rem 1.5rem;
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    font-weight: 700;
  }

  td {
    padding: 1.2rem 1.5rem;
    border-bottom: 1px solid var(--border);
    font-size: .95rem;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255, 255, 255, 0.02); }

  .badge {
    padding: .4rem .8rem;
    border-radius: 8px;
    font-size: .75rem;
    font-weight: 700;
    text-transform: uppercase;
  }
  .badge-oui { background: rgba(34, 197, 94, 0.1); color: #4ADE80; }
  .badge-non { background: rgba(239, 68, 68, 0.1); color: #F87171; }

  .amount-val { font-weight: 700; color: #fff; }
  .name-val { font-weight: 600; color: var(--brand); }
  .date-val { color: var(--text-dim); font-size: .85rem; }

  .empty-state {
    padding: 4rem;
    text-align: center;
    color: var(--text-dim);
  }

  @media (max-width: 768px) {
    body { padding: 1rem; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
    th:nth-child(4), td:nth-child(4) { display: none; } /* Hide date on mobile */
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">
      <div class="logo-icon">N</div>
      <div class="logo-text">NELAL <span>EXPRESS</span></div>
    </div>
    <div class="status-badge" id="status-badge">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">Connexion...</span>
    </div>
  </header>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon"><span class="material-symbols-rounded">groups</span></div>
      <div class="stat-label">Total Participants</div>
      <div class="stat-value" id="stat-total">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><span class="material-symbols-rounded">payments</span></div>
      <div class="stat-label">Cagnotte Mensuelle</div>
      <div class="stat-value" id="stat-cagnotte">0 <span>F</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="color:var(--success)"><span class="material-symbols-rounded">check_circle</span></div>
      <div class="stat-label">Partants (Oui)</div>
      <div class="stat-value" id="stat-oui">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="color:var(--danger)"><span class="material-symbols-rounded">cancel</span></div>
      <div class="stat-label">Pas maintenant (Non)</div>
      <div class="stat-value" id="stat-non">0</div>
    </div>
  </div>

  <div class="table-container">
    <div class="table-header">
      <div class="table-title">Détails des votes</div>
      <button onclick="exportCSV()" style="background:transparent; border:1px solid var(--border); color:var(--text-muted); padding:.5rem 1rem; border-radius:8px; cursor:pointer; font-size:.8rem; display:flex; align-items:center; gap:.5rem;">
        <span class="material-symbols-rounded" style="font-size:1.2rem">download</span> Exporter CSV
      </button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Nom / Prénom</th>
          <th>Vote</th>
          <th>Montant</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="votes-body">
        <!-- Rempli par JS -->
      </tbody>
    </table>
    <div id="empty-state" class="empty-state" style="display:none;">
      Aucun vote enregistré pour le moment.
    </div>
  </div>
</div>

<script>
const SUPABASE_URL      = 'https://exxcffzyawyttwxwsttb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4eGNmZnp5YXd5dHR3eHdzdHRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NDIyMTYsImV4cCI6MjA5MzQxODIxNn0.AC7Mr1glNvSEnJL1_n0KBmSf5p_HG2bUQMv8Cfhp58Y';

const { createClient } = window.supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allVotes = [];

async function loadData() {
  try {
    const { data, error } = await db
      .from('votes')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) throw error;
    
    allVotes = data || [];
    renderDashboard();
    updateStatus(true);
  } catch (e) {
    console.error(e);
    updateStatus(false);
  }
}

function renderDashboard() {
  const total = allVotes.length;
  const ouiList = allVotes.filter(v => v.vote === 'oui');
  const nonList = allVotes.filter(v => v.vote === 'non');
  const totalCagnotte = ouiList.reduce((s, v) => s + (v.amount || 0), 0);

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-oui').textContent = ouiList.length;
  document.getElementById('stat-non').textContent = nonList.length;
  document.getElementById('stat-cagnotte').innerHTML = totalCagnotte.toLocaleString('fr-FR') + ' <span>F</span>';

  const body = document.getElementById('votes-body');
  const empty = document.getElementById('empty-state');
  
  if (total === 0) {
    body.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  body.innerHTML = allVotes.map(v => `
    <tr>
      <td class="name-val">${v.name || 'Anonyme'}</td>
      <td>
        <span class="badge badge-${v.vote}">${v.vote === 'oui' ? 'Partant' : 'Non'}</span>
      </td>
      <td class="amount-val">${(v.amount || 0).toLocaleString('fr-FR')} F</td>
      <td class="date-val">${new Date(v.created_at).toLocaleString('fr-FR', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' })}</td>
    </tr>
  `).join('');
}

function updateStatus(online) {
  const badge = document.getElementById('status-badge');
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  
  if (online) {
    badge.classList.remove('offline');
    dot.classList.remove('offline');
    txt.textContent = 'En direct';
  } else {
    badge.classList.add('offline');
    dot.classList.add('offline');
    txt.textContent = 'Erreur connexion';
  }
}

function setupRealtime() {
  db.channel('admin-votes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'votes' }, () => {
      loadData();
    })
    .subscribe();
}

function exportCSV() {
  if (allVotes.length === 0) return;
  
  const headers = ['Nom', 'Vote', 'Montant', 'Date'];
  const rows = allVotes.map(v => [
    v.name || 'Anonyme',
    v.vote,
    v.amount,
    new Date(v.created_at).toISOString()
  ]);

  let csvContent = "data:text/csv;charset=utf-8," 
    + headers.join(",") + "\n"
    + rows.map(e => e.join(",")).join("\n");

  const encodedUri = encodeURI(csvContent);
  const link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", `resultats_sondage_${new Date().toISOString().split('T')[0]}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// Init
loadData();
setupRealtime();
</script>

</body>
</html>
